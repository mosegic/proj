
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI-Generated Quiz App</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary-color: #4a90e2;
            --text-color: #333333;
            --success-color: #2ecc71;
            --error-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .quiz-container {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            padding: 30px;
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        .progress-bar {
            height: 6px;
            background-color: #e0e0e0;
            border-radius: 3px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
        }

        h2 {
            margin-top: 0;
            font-size: 1.4rem;
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 20px;
        }

        .btn-option {
            background-color: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
        }

        .btn-option:hover:not(:disabled) {
            background-color: #e9ecef;
            border-color: #ced4da;
        }

        .btn-option.correct {
            background-color: var(--success-color);
            color: white;
            border-color: var(--success-color);
        }

        .btn-option.wrong {
            background-color: var(--error-color);
            color: white;
            border-color: var(--error-color);
        }

        .btn-next {
            display: none;
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        .btn-next:hover {
            opacity: 0.9;
        }

        .score-screen {
            text-align: center;
            display: none;
        }

        .score-text {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 20px 0;
        }
    </style>
</head>
<body>

<div class="quiz-container">
    <!-- Active Quiz View -->
    <div id="quiz-view">
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <h2 id="question-text">Loading question...</h2>
        <div class="options-container" id="options"></div>
        <button class="btn-next" id="next-btn">Next Question</button>
    </div>

    <!-- Final Score View -->
    <div id="score-view" class="score-screen">
        <h2>Quiz Completed!</h2>
        <div class="score-text" id="final-score">0 / 0</div>
        <div class="score-text" id="feedback">0 / 0</div>
        <button class="btn-option" style="text-align:center; width:100%;" onclick="resetQuiz()">Restart Quiz</button>
    </div>
</div>

<script>
    // Quiz Questions Data Structure
    const quizData = [
        {
            question: "What does HTML stand for?",
            options: [
                "Hyper Text Markup Language",
                "High Text Machine Language",
                "Hyper Link Markup Language",
                "Hyper Text Markdown Language"
            ],
            correct: 0
        },
        {
            question: "Which language is primarily used to style a webpage?",
            options: ["Python", "HTML", "CSS", "SQL"],
            correct: 2
        },
        {
            question: "What is the correct syntax to output 'Hello World' in Python?",
            options: ["print('Hello World')", "echo('Hello World')", "console.log('Hello World')", "printf('Hello World')"],
            correct: 0
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;

    const questionEl = document.getElementById("question-text");
    const optionsContainer = document.getElementById("options");
    const nextButton = document.getElementById("next-btn");
    const progressFill = document.getElementById("progress");
    const quizView = document.getElementById("quiz-view");
    const scoreView = document.getElementById("score-view");
    const finalScoreEl = document.getElementById("final-score");

    // Optimized JavaScript Updates

function loadQuestion() {
    answered = false;
    nextButton.style.display = "none";
    optionsContainer.innerHTML = "";
    
    const currentData = quizData[currentQuestionIndex];
    questionEl.innerText = currentData.question;
    
    // FIX: Update Progress Bar to reflect current active question out of total
    const progressPercentage = ((currentQuestionIndex + 1) / quizData.length) * 100;
    progressFill.style.width = `${progressPercentage}%`;

    currentData.options.forEach((option, index) => {
        const button = document.createElement("button");
        button.innerText = option;
        button.classList.add("btn-option");
        // Accessibility attribute
        button.setAttribute("aria-label", `Option ${index + 1}: ${option}`);
        button.addEventListener("click", () => selectOption(button, index));
        optionsContainer.appendChild(button);
    });
}

    function selectOption(selectedButton, index) {
        if (answered) return; // Prevent multiple clicks
        answered = true;

        const correctAnswerIndex = quizData[currentQuestionIndex].correct;
        const allButtons = optionsContainer.querySelectorAll(".btn-option");

        if (index === correctAnswerIndex) {
            selectedButton.classList.add("correct");
            score++;
        } else {
            selectedButton.classList.add("wrong");
            // Highlight the correct answer for clarity
            allButtons[correctAnswerIndex].classList.add("correct");
        }

        // Disable all option buttons after picking
        allButtons.forEach(btn => btn.disabled = true);
        nextButton.style.display = "block";
    }

    nextButton.addEventListener("click", () => {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showScore();
        }
    });

  function showScore() {
    quizView.style.display = "none";
    scoreView.style.display = "block";
    
    // Dynamic Performance Feedback
    finalScoreEl.innerText = `${score} / ${quizData.length}`;
    const percentage = (score / quizData.length) * 100;
    
    let feedbackText = "Keep practicing!";
    if (percentage === 100) feedbackText = "Perfect Score! 🎉";
    else if (percentage >= 70) feedbackText = "Great Job! 👍";
    
    // Assumes an element with id="feedback" exists in your score-view HTML
    document.getElementById("feedback").innerText = feedbackText; 
}
    function resetQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        quizView.style.display = "block";
        scoreView.style.display = "none";
        loadQuestion();
    }

    // Initialize Quiz on load
    loadQuestion();
    
  


   
   
   
   
   
    
</script>

</body>
</html>
